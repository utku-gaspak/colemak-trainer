# Builds the desktop apps on each OS's own runner (macOS apps can only be built
# on macOS). Run it from the Actions tab, or push a tag like v0.2.0 to also
# attach the files to a GitHub release.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            files: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            script: build:win
            files: release/*.exe
          - os: ubuntu-latest
            script: build:linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # --publish never: electron-builder would otherwise try to upload on tags itself.
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: kegex-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
